<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload File</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: white;
            padding: 25px;
            border-radius: 15px;
            width: 90%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        h2 {
            margin-bottom: 20px;
            color: #333;
        }

        input[type="file"] {
            margin: 15px 0;
        }

        button {
            background: #4facfe;
            border: none;
            padding: 12px 20px;
            color: white;
            font-size: 16px;
            border-radius: 25px;
            cursor: pointer;
            width: 100%;
            transition: 0.3s;
        }

        button:hover {
            background: #00c6ff;
        }

        .progress-container {
            margin-top: 20px;
        }

        progress {
            width: 100%;
            height: 12px;
            border-radius: 10px;
            overflow: hidden;
        }

        progress::-webkit-progress-bar {
            background: #eee;
            border-radius: 10px;
        }

        progress::-webkit-progress-value {
            background: #4facfe;
        }

        #status {
            margin-top: 10px;
            font-size: 14px;
            color: #555;
        }

        /* Mobile */
        @media (max-width: 480px) {
            .container {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>📁 Upload Files</h2>

        <input type="file" id="fileInput" multiple>

        <button onclick="uploadFiles()">Upload</button>

        <div class="progress-container">
            <progress id="progressBar" value="0" max="100"></progress>
            <p id="status"></p>
        </div>
    </div>

    <script>

        async function uploadFiles() {

            const files = document.getElementById("fileInput").files;

            if (files.length === 0) {
                return alert("Select files");
            }

            for (const file of files) {
                await uploadSingleFile(file);
            }

            document.getElementById("status").innerText =
                "✅ All uploads completed";
        }

        async function uploadSingleFile(file) {

            const chunkSize = 5 * 1024 * 1024; // 5MB

            const totalChunks = Math.ceil(file.size / chunkSize);

            for (let chunkIndex = 0; chunkIndex < totalChunks; chunkIndex++) {

                const start = chunkIndex * chunkSize;

                const end = Math.min(
                    start + chunkSize,
                    file.size
                );

                const chunk = file.slice(start, end);

                const formData = new FormData();

                formData.append("chunk", chunk);

                formData.append(
                    "chunkIndex",
                    chunkIndex
                );

                formData.append(
                    "totalChunks",
                    totalChunks
                );

                formData.append(
                    "fileName",
                    file.name
                );

                await sendChunk(
                    formData,
                    chunkIndex,
                    totalChunks,
                    file.name
                );
            }
        }

        function sendChunk(
            formData,
            chunkIndex,
            totalChunks,
            fileName
        ) {

            return new Promise((resolve, reject) => {

                const xhr = new XMLHttpRequest();

                xhr.open(
                    "POST",
                    window.location.href,
                    true
                );

                xhr.upload.onprogress = function (e) {

                    if (e.lengthComputable) {

                        const currentChunkProgress =
                            (e.loaded / e.total);

                        const totalProgress =
                            (
                                (
                                    chunkIndex +
                                    currentChunkProgress
                                ) / totalChunks
                            ) * 100;

                        document.getElementById(
                            "progressBar"
                        ).value = totalProgress;

                        document.getElementById(
                            "status"
                        ).innerText =
                            `Uploading ${fileName} : ${Math.round(totalProgress)}%`;
                    }
                };

                xhr.onload = function () {

                    if (xhr.status === 200) {

                        if (chunkIndex + 1 === totalChunks) {

                            document.getElementById(
                                "status"
                            ).innerText =
                                `✅ ${fileName} uploaded`;
                        }

                        resolve();

                    } else {

                        document.getElementById(
                            "status"
                        ).innerText =
                            `❌ Upload failed`;

                        reject();
                    }
                };

                xhr.onerror = function () {

                    document.getElementById(
                        "status"
                    ).innerText =
                        `❌ Network error`;

                    reject();
                };

                xhr.send(formData);
            });
        }

    </script>

</body>

</html>
